name: isetag-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: isetag-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  directus:
    image: directus/directus:11
    container_name: isetag-directus-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8055:8055"
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      IP_TRUST_PROXY: "true"
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      CACHE_ENABLED: "true"
      CACHE_STORE: memory
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:4200,http://localhost:4000"
      EMAIL_TRANSPORT: smtp
      EMAIL_SMTP_HOST: ${SMTP_HOST}
      EMAIL_SMTP_PORT: ${SMTP_PORT}
      EMAIL_SMTP_USER: ${SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${SMTP_FROM}
      ADMISSIONS_EMAIL: ${ADMISSIONS_EMAIL}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
      FLOWS_ENV_ALLOW_LIST: PUBLIC_URL,ADMISSIONS_EMAIL,CONTACT_EMAIL
    volumes:
      - ../../cms/uploads:/directus/uploads
      - ../../cms/extensions:/directus/extensions
      - ../../cms/snapshots:/directus/snapshots

volumes:
  postgres_data:
