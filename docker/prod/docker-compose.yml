# Stack de production. Tourne aux côtés de docker/staging sur le même VPS unique
# (voir proposition technique signée : un seul "Hébergement Web Premium (Cloud/VPS)").
#
# Nginx vit ici (et non dans staging) car un seul processus peut tenir les ports 80/443
# de l'hôte. Il rejoint le réseau externe "isetag_edge" pour proxyfier aussi bien les
# conteneurs prod que staging par leur container_name.
#
# Préparation (une seule fois sur le VPS) :
#   docker network create isetag_edge
#   mkdir -p /etc/letsencrypt cms/uploads cms/snapshots
#
# Déploiement : voir scripts/deploy.sh (pull des images -> up -d -> apply snapshot).

name: isetag-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: isetag-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  directus:
    image: directus/directus:11.17.4
    container_name: isetag-directus-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      # CACHE_ENABLED=false (2026-08-27) -- was "true" + CACHE_STORE=memory,
      # which is broken under this container's PM2 cluster mode (2 worker
      # processes, confirmed via `ps aux`): each worker keeps its own
      # in-process cache, so schema/permission changes are only visible to
      # whichever worker happened to handle the write, causing the OTHER
      # worker to keep serving stale field lists/403s on `fields=*` queries
      # -- confirmed via 10 sequential fields=* requests flapping ~50/50
      # even right after a full container restart. Real fix is a shared
      # cache (Redis) or disabling cache outright; traffic is low enough
      # that disabling is the simpler, safe choice for now. Explicit
      # field-list queries were unaffected either way (100% reliable before
      # this change) -- only `fields=*` wildcard expansion flapped.
      CACHE_ENABLED: "false"
      CORS_ENABLED: "true"
      # isetag-univ.net/www: futur domaine réel (DNS pas encore basculé, WordPress
      # dessus pour l'instant) ; isetag.web.app: hébergement Firebase actuel du
      # frontend ; 31-207-34-25.sslip.io: origine directe utilisée pour les tests ;
      # localhost:4200/4201: dev local de Djo contre le contenu prod.
      CORS_ORIGIN: "https://isetag-univ.net,https://www.isetag-univ.net,https://isetag.web.app,https://31-207-34-25.sslip.io,http://localhost:4200,http://localhost:4201"
      EMAIL_TRANSPORT: smtp
      EMAIL_SMTP_HOST: ${SMTP_HOST}
      EMAIL_SMTP_PORT: ${SMTP_PORT}
      EMAIL_SMTP_USER: ${SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${SMTP_FROM}
      ADMISSIONS_EMAIL: ${ADMISSIONS_EMAIL}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
      FLOWS_ENV_ALLOW_LIST: PUBLIC_URL,ADMISSIONS_EMAIL,CONTACT_EMAIL
    volumes:
      - ../../cms/uploads:/directus/uploads
      - ../../cms/extensions:/directus/extensions
      - ../../cms/snapshots:/directus/snapshots
    networks:
      - internal
      - isetag_edge

  # Pas de service "frontend" : le site public est un build Angular statique (SSG),
  # deploye par la CI GitHub Actions (rsync) directement dans /opt/isetag/frontend/dist
  # sur le VPS -- aucun serveur Node/SSR a faire tourner, nginx sert les fichiers
  # directement (voir nginx/conf.d/isetag-prod.conf).

  # Config cible une fois le DNS isetag-univ.net/cms.isetag-univ.net basculé
  # vers ce VPS (sert nginx/conf.d/isetag-prod.conf). Pas encore ce qui tourne
  # réellement aujourd'hui : voir isetag-nginx-prod (nginx-prod/conf.d/,
  # hostname sslip.io + cms.isetag-univ.net + preview.isetag-univ.net),
  # actuellement démarré manuellement en dehors de ce compose (mêmes mounts
  # que ci-dessous, plus /opt/isetag/frontend/dist -- voir
  # ISETAG_manual_deploy_runbook.txt). À fusionner une fois le DNS prêt.
  nginx:
    image: nginx:1.27-alpine
    container_name: isetag-nginx-prod
    restart: always
    depends_on:
      - directus
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../nginx/snippets:/etc/nginx/snippets:ro
      - certbot_webroot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../../frontend/dist:/opt/isetag/frontend/dist:ro
    networks:
      - isetag_edge

  certbot:
    image: certbot/certbot
    container_name: isetag-certbot
    profiles: ["certbot"]
    volumes:
      - certbot_webroot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt

networks:
  internal:
  isetag_edge:
    external: true

volumes:
  postgres_data_prod:
  certbot_webroot:
