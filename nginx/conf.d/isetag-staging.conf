# Staging - staging.isetag-univ.net
#
# Même VPS que la prod (le budget signé ne couvre qu'un seul serveur), exposé sur des
# sous-domaines dédiés plutôt que des ports, pour bénéficier de TLS sur les deux environnements.
#
# Prérequis avant activation :
#   1. Enregistrements DNS A pour staging.isetag-univ.net et cms-staging.isetag-univ.net
#      pointant vers l'IP du VPS.
#   2. Certificats TLS :
#        certbot certonly --webroot -w /var/www/certbot -d staging.isetag-univ.net
#        certbot certonly --webroot -w /var/www/certbot -d cms-staging.isetag-univ.net
#   3. DIRECTUS_PUBLIC_URL=https://cms-staging.isetag-univ.net dans le .env de staging.

#   4. Ces conteneurs staging rejoignent le réseau Docker externe partagé "isetag_edge"
#      (voir docker/staging/docker-compose.yml) pour être joignables depuis Nginx, qui
#      tourne lui dans la stack prod (docker/prod/docker-compose.yml).

upstream frontend_staging_upstream {
    server isetag-frontend-staging:4000;
}

upstream directus_staging_upstream {
    server isetag-directus-staging:8055;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.isetag-univ.net cms-staging.isetag-univ.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Frontend staging ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.isetag-univ.net;

    ssl_certificate     /etc/letsencrypt/live/staging.isetag-univ.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.isetag-univ.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/snippets/security-headers.conf;
    # Environnement de test : on demande aux moteurs de recherche de ne pas l'indexer.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://frontend_staging_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Directus staging ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cms-staging.isetag-univ.net;

    ssl_certificate     /etc/letsencrypt/live/cms-staging.isetag-univ.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms-staging.isetag-univ.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 20M;

    location / {
        proxy_pass http://directus_staging_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
