# Production - isetag-univ.net
#
# Deux sous-domaines :
#   isetag-univ.net / www.isetag-univ.net -> build statique Angular (SSG), fichiers
#                                             deployes par la CI GitHub Actions dans
#                                             /opt/isetag/frontend/dist (voir le meme
#                                             pattern deja verifie sur preview.isetag-univ.net,
#                                             nginx-prod/conf.d/frontend-preview.conf)
#   cms.isetag-univ.net                   -> Directus (service "directus", port 8055)
#
# Le frontend est du SSG pur (Angular, outputMode "static") : aucun serveur Node/SSR
# a faire tourner, donc pas de service "frontend" ni d'upstream pour lui -- juste des
# fichiers statiques servis directement par ce nginx.
#
# Prérequis avant activation :
#   1. Enregistrements DNS A pour isetag-univ.net, www.isetag-univ.net et cms.isetag-univ.net
#      pointant vers l'IP du VPS.
#   2. Certificats TLS obtenus via certbot (webroot /var/www/certbot, voir deploy.sh) :
#        certbot certonly --webroot -w /var/www/certbot \
#          -d isetag-univ.net -d www.isetag-univ.net
#        certbot certonly --webroot -w /var/www/certbot -d cms.isetag-univ.net
#   3. DIRECTUS_PUBLIC_URL=https://cms.isetag-univ.net dans le .env de prod.

#   4. Nginx tourne dans la stack prod et rejoint le réseau Docker externe partagé
#      "isetag_edge" (voir docker/prod/docker-compose.yml) afin de pouvoir aussi
#      joindre les conteneurs de la stack staging par leur container_name.

upstream directus_upstream {
    server isetag-directus-prod:8055;
}

# --- Redirection HTTP -> HTTPS (tous domaines) ---
server {
    listen 80;
    listen [::]:80;
    server_name isetag-univ.net www.isetag-univ.net cms.isetag-univ.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Site public (build statique SSG) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name isetag-univ.net www.isetag-univ.net;

    ssl_certificate     /etc/letsencrypt/live/isetag-univ.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isetag-univ.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cms.isetag-univ.net; font-src 'self' data:; connect-src 'self' https://cms.isetag-univ.net; frame-ancestors 'self'" always;

    root /opt/isetag/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# --- Directus (admin + API) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cms.isetag-univ.net;

    ssl_certificate     /etc/letsencrypt/live/cms.isetag-univ.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.isetag-univ.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/snippets/security-headers.conf;
    # Pas de CSP stricte ici : l'app d'admin Directus gère ses propres en-têtes de sécurité.

    client_max_body_size 20M;

    location / {
        proxy_pass http://directus_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
