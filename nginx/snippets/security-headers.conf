# Snippet commun d'en-têtes de sécurité, inclus par les vhosts HTTPS.
# CSP volontairement définie par vhost (contenu différent entre le site public et le CMS).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# HSTS : n'activer qu'une fois le certificat TLS confirmé stable sur le domaine.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
