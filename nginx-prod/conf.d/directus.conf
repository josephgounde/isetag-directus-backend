# Config nginx RÉELLEMENT active en prod (conteneur isetag-nginx-prod, image
# nginx:1.27-alpine, monté seul via -v .../nginx-prod/conf.d:/etc/nginx/conf.d,
# pas de nginx.conf propre : utilise les défauts de l'image + ce fichier).
#
# Interim volontaire tant que isetag-univ.net pointe encore vers le WordPress
# existant (DNS pas encore basculé) : sert directement sur le hostname
# sslip.io de l'IP du VPS, certs Let's Encrypt réels pour ce domaine.
#
# À REMPLACER par nginx/conf.d/isetag-prod.conf (déjà versionné, sert
# isetag-univ.net + cms.isetag-univ.net) une fois le DNS basculé — voir
# ISETAG_project_instructions.md, entrée "Directus prod passé en HTTPS" et
# "fix du checkout git de /opt/isetag" pour l'historique complet.
#
# Reconstitué depuis le VPS le 2026-08-13 (ce fichier n'existait que là,
# jamais commité jusqu'ici) — ne pas modifier sans le redéployer aussi sur
# /opt/isetag/nginx-prod/conf.d/directus.conf.
server {
    listen 80;
    listen [::]:80;
    client_max_body_size 50M;
    server_name 31-207-34-25.sslip.io _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://isetag-directus-prod:8055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    client_max_body_size 50M;
    server_name 31-207-34-25.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/31-207-34-25.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/31-207-34-25.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://isetag-directus-prod:8055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
