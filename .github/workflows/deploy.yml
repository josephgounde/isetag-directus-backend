name: Deploy

# Secrets requis dans les paramètres du repo GitHub (Settings > Secrets and variables > Actions) :
#   VPS_HOST     - IP ou nom d'hôte du VPS
#   VPS_USER     - utilisateur SSH (ex: deploy)
#   VPS_SSH_KEY  - clé privée SSH correspondante
#   VPS_PORT     - port SSH (optionnel, défaut 22)
#
# Push sur main -> déploiement automatique en staging.
# Déclenchement manuel -> choix de l'environnement (staging ou prod), pour éviter
# qu'un simple push ne parte en production sans validation explicite.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-frontend
  TARGET_ENV: ${{ github.event.inputs.environment || 'staging' }}

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      built: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence du Dockerfile frontend
        id: check
        run: echo "exists=$(test -f frontend/Dockerfile && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Connexion à ghcr.io
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image frontend
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TARGET_ENV }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TARGET_ENV }}-${{ github.sha }}

  deploy:
    needs: build-frontend
    if: needs.build-frontend.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/isetag
            git pull origin main
            FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TARGET_ENV }} \
              ./scripts/deploy.sh ${{ env.TARGET_ENV }}
