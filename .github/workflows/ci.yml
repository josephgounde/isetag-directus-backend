name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valider docker/dev
        run: |
          cp .env.example .env
          docker compose -f docker/dev/docker-compose.yml --env-file .env config --quiet

      - name: Valider docker/staging
        run: docker compose -f docker/staging/docker-compose.yml --env-file .env.staging.example config --quiet

      - name: Valider docker/prod
        run: docker compose -f docker/prod/docker-compose.yml --env-file .env.prod.example config --quiet

  validate-nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer des certificats factices et tester la config Nginx
        run: |
          for d in isetag-univ.net cms.isetag-univ.net staging.isetag-univ.net cms-staging.isetag-univ.net; do
            mkdir -p "/tmp/letsencrypt/live/$d"
            openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
              -keyout "/tmp/letsencrypt/live/$d/privkey.pem" \
              -out "/tmp/letsencrypt/live/$d/fullchain.pem" \
              -subj "/CN=localhost" >/dev/null 2>&1
          done
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "/tmp/letsencrypt:/etc/letsencrypt:ro" \
            nginx:alpine nginx -t

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence du Dockerfile frontend
        id: check
        run: echo "exists=$(test -f frontend/Dockerfile && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build de l'image frontend (contrôle uniquement, pas de push)
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
