# Ancien stopgap HTTP-only (conteneur isetag-nginx-temp), remplacé par
# nginx-prod/conf.d/directus.conf (HTTPS réel) le 2026-08-05. Conteneur
# arrêté mais laissé en place comme filet de sécurité, non supprimé — voir
# ISETAG_project_instructions.md. Reconstitué depuis le VPS le 2026-08-13
# (jamais commité jusqu'ici).
server {
    listen 80;
    client_max_body_size 50M;
    server_name _;

    location / {
        proxy_pass http://isetag-directus-prod:8055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
